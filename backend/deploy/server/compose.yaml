# 作用：Linux 服务器仅常驻 API，复用宿主机宝塔 Nginx/MySQL；迁移按需运行。
name: jobless-game-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  api:
    image: jobless-game-api:server
    network_mode: host
    restart: unless-stopped
    init: true
    env_file: .env.api
    # Linux 宿主机网络下只监听回环，信任宝塔本机代理。
    command: ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "127.0.0.1", "--port", "8001", "--workers", "1", "--limit-concurrency", "32", "--backlog", "32", "--timeout-keep-alive", "5", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    cpus: 1.0
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/rankings/mine?page_size=1', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  migrate:
    profiles: [tools]
    image: redgate/flyway:13.6.0
    network_mode: host
    restart: "no"
    entrypoint: ["flyway", "-configFiles=/flyway/conf/jobless.toml"]
    command: ["info"]
    environment:
      JAVA_ARGS: -Xms32m -Xmx192m
    volumes:
      - ./flyway.toml:/flyway/conf/jobless.toml:ro
      - ./migrations:/flyway/sql:ro
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging: *logging
