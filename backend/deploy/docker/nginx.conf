# 作用：本机 HTTP 验证入口；保留浏览器原始 Host（含端口），确保同源校验正确。
limit_req_zone $binary_remote_addr zone=jobless_login:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;

    # 静态文件检测不访问数据库，API 的健康检测另做真实数据库查询。
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location = /api/auth/login {
        limit_req zone=jobless_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_busy;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # 文字正文含中文和 JSON 转义，论坛独立32KiB；其他接口仍为4KiB。
    location /api/forum/ {
        client_max_body_size 32k;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # SSE只读长响应单独关闭缓冲；普通API继续10秒超时。
    location = /api/v1/me/events {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        include /etc/nginx/conf.d/proxy.inc;
    }

    location @login_busy {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":"登录请求过于频繁，请稍后重试。"}';
    }

    location /assets/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
