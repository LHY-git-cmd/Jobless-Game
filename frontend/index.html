<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="无职游戏：扫雷、照明与数独三关解谜游戏。"
    />
    <meta name="theme-color" content="#102b3c" />
    <title>无职游戏</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./favicon.ico?v=20261018-island"
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components/energy.css"><link rel="stylesheet" href="./styles/components/navigation.css" />
    <link rel="modulepreload" href="./src/pages/journey.js" />
  </head>
  <body>
    <div class="world-background" aria-hidden="true"></div>
    <main class="page">
      <section id="landing" aria-labelledby="landing-title">
        <header class="landing-header">
          <div class="player-profile" data-player-profile aria-label="账号与成长"></div>
          <nav class="site-nav" aria-label="主导航">
            <a href="./ranking.html">排行榜</a>
            <a href="./index.html" aria-current="page">无职游戏</a>
            <a href="./forum.html">论坛</a>
          </nav>
          <div class="auth-controls" aria-label="账号"></div>
        </header>
        <div class="landing-intro">
          <div class="landing-hero">
            <p class="eyebrow">
              <span aria-hidden="true"></span> 解谜之旅，从这里开始
            </p>
            <h1 id="landing-title">
              无职游戏<span>让好奇心，带你出发。</span>
            </h1>
            <p class="hero-description">
              暂别忙碌，潜入这片蔚蓝。<br />在数字与光影之间，找到你的答案。
            </p>
            <button type="button" class="explore-link" id="challenge-action">
              <span id="challenge-action-label">选择你的挑战</span
              ><span id="challenge-action-icon" aria-hidden="true">↓</span>
            </button>
          </div>
        </div>
        <div class="level-select" id="level-select">
          <div class="section-heading"><h2>冒险启程</h2><span>选择游戏，开启下一段旅程</span></div>
          <div class="level-grid">
            <a id="mine-entry" class="level-card mine-card" data-game="mine" href="./journey.html?game_id=mine" aria-label="扫雷，进入新版选关页">
              <span class="level-art"><img src="./assets/minesweeper/v2/theme.webp" width="320" height="320" alt=""></span>
              <span class="level-content"><span class="level-title">扫雷</span><span class="level-description">步步推理，避开暗藏的危险。</span><span class="level-meta">新版选关<span>关卡准备中</span></span></span>
              <span class="level-arrow" aria-hidden="true">选择关卡 →</span>
            </a>
            <a id="akari-entry" class="level-card light-card" data-game="akari" href="./journey.html?game_id=akari" aria-label="照明，进入新版选关页">
              <span class="level-art"><img src="./assets/bulb.webp" width="320" height="320" alt=""></span>
              <span class="level-content"><span class="level-title">照明</span><span class="level-description">点亮一盏灯，驱散每一处黑暗。</span><span class="level-meta">新版选关<span>关卡准备中</span></span></span>
              <span class="level-arrow" aria-hidden="true">选择关卡 →</span>
            </a>
            <a id="sudoku-entry" class="level-card sudoku-card" data-game="sudoku" href="./journey.html?game_id=sudoku" aria-label="数独，进入新版选关页">
              <span class="level-art sudoku-art" aria-hidden="true"><span>1</span><span>2</span><span></span><span></span><span>5</span><span>6</span><span>7</span><span></span><span>9</span></span>
              <span class="level-content"><span class="level-title">数独</span><span class="level-description">在九宫格里，发现秩序之美。</span><span class="level-meta">新版选关<span>关卡准备中</span></span></span>
              <span class="level-arrow" aria-hidden="true">选择关卡 →</span>
            </a>
          </div>
        </div>
        <footer class="landing-footer"><a class="mine-practice-entry" href="./pk.html">双人照明竞速 ↗</a><span>慢一点，答案就在思考之间。</span></footer>
      </section>
    </main>
    <script type="module" src="./src/pages/home.js"></script>
  </body>
</html>
