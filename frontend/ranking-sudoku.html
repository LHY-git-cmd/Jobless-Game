<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="无职游戏数独排行，查看玩家最佳通关成绩。" />
    <meta name="theme-color" content="#102b3c" />
    <title>数独排行 · 无职游戏</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20261018-island" />
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body data-ranking="sudoku">
    <div class="world-background" aria-hidden="true"></div>
    <div class="page destination-page ranking-page">
      <header class="landing-header">
        <nav class="site-nav" aria-label="主导航">
          <a href="./ranking.html" aria-current="page">排行榜</a>
          <a href="./index.html">无职游戏</a><a href="./forum.html">论坛</a>
        </nav>
        <div class="auth-controls" aria-label="账号"></div>
      </header>
      <main class="ranking-content" aria-labelledby="ranking-title">
        <h1 id="ranking-title" class="sr-only">数独排行</h1>
        <nav class="ranking-tabs" aria-label="选择排行榜"><a href="./ranking-mine.html">扫雷排行</a>
<a href="./ranking-akari.html">照明排行</a>
<a href="./ranking-sudoku.html" aria-current="page">数独排行</a></nav>
        <section class="ranking-card" aria-labelledby="ranking-title">
          <div class="ranking-rule"><span class="ranking-rule-mark" aria-hidden="true">◇</span><p>按数独历史最短通关时长排名。</p></div>
          <div class="ranking-table-wrap">
            <table id="ranking-table" aria-busy="true" aria-describedby="ranking-status">
              <caption class="sr-only">数独排行：名次、玩家用户名与最佳通关用时</caption>
              <thead><tr><th scope="col">名次</th><th scope="col">玩家</th><th scope="col">最佳用时</th></tr></thead>
              <tbody id="ranking-rows"></tbody>
            </table>
          </div>
          <div class="ranking-feedback"><p id="ranking-status" role="status">正在读取冒险记录…</p><button type="button" id="ranking-retry" class="hidden">重新加载</button></div>
          <nav class="ranking-pagination" aria-label="榜单分页"><button type="button" id="ranking-prev" disabled>上一页</button><span id="ranking-page" aria-live="polite">1 / 1</span><button type="button" id="ranking-next" disabled>下一页</button></nav>
        </section>
      </main>
      <footer class="landing-footer"><span>慢一点，答案就在思考之间。</span></footer>
    </div>
    <script type="module" src="./src/pages/ranking.js"></script>
  </body>
</html>
